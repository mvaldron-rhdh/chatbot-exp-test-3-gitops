apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chatbot-exp-test-3-app
  namespace: openshift-gitops
  finalizers: ["resources-finalizer.argocd.argoproj.io"]
spec:
  project: default
  source:
    path: ./components/chatbot-exp-test-3/overlays/development
    repoURL: https://github.com/mvaldron-rhdh/chatbot-exp-test-3-gitops.git
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: rolling-demo
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
